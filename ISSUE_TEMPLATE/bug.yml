name: Bug report
description: Something behaves differently from what the docs say
labels: ["bug"]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `openclaw --version` and `clawos --version` (or the `@clawos/*` package versions)
      placeholder: openclaw 2026.9.2 · @clawos/kernel 0.1.0
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Include the relevant lines from `clawos audit tail` if it's an access or approval question.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. clawos grant add --agent home file:///tmp/x
        2. ask the agent to list the folder
        3. ...
  - type: checkboxes
    id: secrets
    attributes:
      label: Secrets check
      options:
        - label: I've removed tokens, grant handles, and anything private from the logs above
          required: true
