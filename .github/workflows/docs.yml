name: docs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  docs-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whitespace and published-scope documentation
        run: |
          git diff --check HEAD^ HEAD
          ! grep -R -n '@clawos/' ISSUE_TEMPLATE SECURITY.md profile
          grep -q '@clawkeepers' profile/README.md
          grep -q 'not yet published' profile/README.md
