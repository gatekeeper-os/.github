name: docs
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whitespace and published-scope documentation
        run: |
          git diff --check HEAD^ HEAD
          ! grep -R -n '@gkos/' ISSUE_TEMPLATE SECURITY.md profile
          grep -q '@gatekeeper-os' profile/README.md
          grep -q 'npm install --global @gatekeeper-os/cli@beta' profile/README.md
          grep -q 'no stable release exists' profile/README.md
